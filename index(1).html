<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Wheel of Destiny</title>
<style>
:root{
  --bg:#0f0d1c; --panel:#1a1730; --ink:#fbefd5; --muted:#b9b0c8; --accent:#f2a33a; --accent-ink:#2a1600; --red:#c8281e; --line:#35305a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#f6efe2; --panel:#ffffff; --ink:#1a1530; --muted:#5c5470; --accent:#c8281e; --accent-ink:#ffffff; --line:#dccfb8;}
}
:root[data-theme="light"]{--bg:#f6efe2; --panel:#ffffff; --ink:#1a1530; --muted:#5c5470; --accent:#c8281e; --accent-ink:#ffffff; --line:#dccfb8;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Trebuchet MS",Verdana,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:14px 14px 30px;display:flex;flex-direction:column;gap:14px}
section{display:flex;flex-direction:column;gap:14px;align-items:center}
.poster{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;box-shadow:0 0 0 1px var(--line),0 10px 30px rgba(0,0,0,.35)}
h1{margin:0;font-family:Impact,"Haettenschweiler","Arial Narrow Bold",sans-serif;font-weight:400;font-size:2.1rem;letter-spacing:.03em;text-align:center;text-transform:uppercase}
.sub{margin:0;color:var(--muted);text-align:center}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 16px;border-radius:10px;cursor:pointer;min-height:44px}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.big{font-size:1.2rem;padding:12px 28px;letter-spacing:.06em;text-transform:uppercase}
button:disabled{opacity:.6;cursor:default}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;color:var(--muted)}
.wheelwrap{position:relative;width:100%;display:flex;justify-content:center;padding-top:14px}
.ptr{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:30px solid var(--red);filter:drop-shadow(0 2px 2px rgba(0,0,0,.5));z-index:2}
canvas{display:block;border-radius:50%;box-shadow:0 8px 28px rgba(0,0,0,.45)}
#note{min-height:1.3em;margin:0;color:var(--accent);text-align:center}
details{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
summary{cursor:pointer;font-weight:700}
details p{color:var(--muted);font-size:.9rem;margin:8px 0}
.prow{display:flex;gap:8px;align-items:center;margin:6px 0}
.prow img{width:36px;height:48px;object-fit:cover;border-radius:6px}
.prow input{flex:1;min-width:0;font:inherit;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.prow button{padding:6px 10px;min-height:36px}
#ov{position:fixed;inset:0;background:rgba(5,4,15,.8);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.card{width:100%;max-width:340px;background:var(--panel);border:2px solid var(--accent);border-radius:16px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:12px;animation:pop .35s ease}
#rimg{width:100%;aspect-ratio:3/4;border-radius:10px;background:#2b1d4a center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:5rem;color:#f2a33a;font-family:Impact,sans-serif}
#rcap{margin:0;color:var(--muted);font-size:.95rem;line-height:1.4}
#rname{margin:0;font-size:1.5rem;font-family:Impact,"Arial Narrow Bold",sans-serif;font-weight:400;letter-spacing:.03em}
.row{display:flex;gap:8px;justify-content:center}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
<main>
  <section id="home">
    <img class="poster" id="poster" alt="Poster: Real People of Class of 1981, Let’s go “Back in The Day”">
    <h1>The Wheel of Destiny</h1>
    <p class="sub">Spin the wheel to meet today’s classmate. A new face every day.</p>
    <button class="main big" id="enter">Enter the wheel</button>
  </section>

  <section id="game" hidden>
    <div class="top"><button id="back">← Home</button><span id="count"></span></div>
    <div class="wheelwrap" id="ww"><div class="ptr"></div><canvas id="cv" aria-label="Spinning wheel of classmates"></canvas></div>
    <p id="note" role="status"></p>
    <button class="main big" id="spin">Spin</button>
    <details>
      <summary>Add your classmates</summary>
      <p>Pick photos from your device. Names come from the file names, and you can edit them. Photos added here stay on this device only.</p>
      <input type="file" id="files" accept="image/*" multiple>
      <div id="plist"></div>
    </details>
  </section>
</main>

<div id="ov" hidden>
  <div class="card" role="dialog" aria-label="Your classmate">
    <div id="rimg"></div>
    <h2 id="rname"></h2>
    <p id="rcap"></p>
    <div class="row"><button class="main" id="again">Spin again</button><button id="close">Close</button></div>
  </div>
</div>

const CAPTION = 'Real Stories of the Class of 1981 – Edgar in the Bahamas with Ted, John Todd and Johnito Oliva… “Back in tha Day”';
const DAILY = [{date:'2026-10-22', name:BUILTIN[0].name, photo:BUILTIN[0].photo, caption:CAPTION}];
function todayPick(){
  const d = new Date(), k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  let pick = DAILY[0];
  DAILY.forEach(x => { if (x.date <= k) pick = x; });
  return pick;
}
const TODAY = todayPick();
const demo = Array.from({length:8}, () => ({name:'Mystery', photo:TODAY.photo, caption:TODAY.caption, real:TODAY.name}));
const list = () => people.length ? people : demo;

function label(name){
  const t = name.trim();
  return t.length <= 10 ? t : t.split(/\s+/)[0].slice(0, 10);
}

function size(){
  const s = Math.min($('ww').clientWidth, 420) || 300;
  cv.width = s * dpr; cv.height = s * dpr;
  cv.style.width = s + 'px'; cv.style.height = s + 'px';
  draw();
}

function draw(){
  const L = list(), n = L.length, st = 2*Math.PI/n, W = cv.width, R = W/2 - 6*dpr;
  ctx.clearRect(0, 0, W, W);
  ctx.save(); ctx.translate(W/2, W/2);
  for (let i = 0; i < n; i++){
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.arc(0, 0, R, rot + i*st, rot + (i+1)*st); ctx.closePath();
    ctx.fillStyle = COLORS[i % 6]; ctx.fill();
    ctx.lineWidth = 2*dpr; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.stroke();
    if (seen.has(i)){ ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fill(); }
    if (n <= 24){
      ctx.save(); ctx.rotate(rot + (i+.5)*st);
      ctx.textAlign = 'right'; ctx.fillStyle = TEXT[i % 6];
      ctx.font = 'bold ' + (n > 14 ? 11 : 14)*dpr + 'px sans-serif';
      ctx.fillText(label(L[i].name), R - 14*dpr, 4*dpr);
      ctx.restore();
    }
  }
  ctx.beginPath(); ctx.arc(0, 0, R, 0, 2*Math.PI);
  ctx.lineWidth = 6*dpr; ctx.strokeStyle = '#f2a33a'; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, R*.15, 0, 2*Math.PI);
  ctx.fillStyle = '#fbefd5'; ctx.fill(); ctx.lineWidth = 3*dpr; ctx.strokeStyle = '#c8281e'; ctx.stroke();
  ctx.fillStyle = '#c8281e'; ctx.font = 'bold ' + R*.12 + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.fillText('★', 0, R*.04);
  ctx.restore();
}

function updateCount(){ $('count').textContent = ''; }

function spin(){
  if (spinning) return;
  const L = list(), n = L.length, st = 2*Math.PI/n;
  let av = L.map((_, i) => i).filter(i => !seen.has(i));
  $('note').textContent = '';
  if (!av.length){ seen.clear(); av = L.map((_, i) => i); $('note').textContent = 'Everyone has appeared. Starting over!'; }
  const t = av[Math.floor(Math.random()*av.length)];
  let target = -Math.PI/2 - (t + .5)*st + (Math.random() - .5)*st*.7;
  while (target < rot + 10*Math.PI) target += 2*Math.PI;
  const from = rot, t0 = performance.now();
  const dur = matchMedia('(prefers-reduced-motion:reduce)').matches ? 1200 : 4800;
  spinning = true; $('spin').disabled = true;
  (function f(now){
    const p = Math.min(1, (now - t0)/dur), e = 1 - Math.pow(1 - p, 4);
    rot = from + (target - from)*e; draw();
    if (p < 1) requestAnimationFrame(f);
    else { spinning = false; $('spin').disabled = false; draw(); reveal(t); }
  })(t0);
}

function reveal(i){
  const p = list()[i], im = $('rimg');
  $('rname').textContent = p.real || p.name;
  $('rcap').textContent = p.caption || '';
  if (p.photo){ im.style.backgroundImage = 'url("' + p.photo + '")'; im.textContent = ''; }
  else { im.style.backgroundImage = 'none'; im.textContent = '?'; }
  $('ov').hidden = false;
  $('again').focus();
}

function renderList(){
  const box = $('plist'); box.innerHTML = '';
  people.forEach((p, i) => {
    const r = document.createElement('div'); r.className = 'prow';
    const im = document.createElement('img'); im.src = p.photo; im.alt = '';
    const inp = document.createElement('input'); inp.value = p.name; inp.setAttribute('aria-label', 'Name');
    inp.oninput = () => { p.name = inp.value; draw(); };
    const x = document.createElement('button'); x.textContent = '✕'; x.setAttribute('aria-label', 'Remove');
    x.onclick = () => { people.splice(i, 1); seen.clear(); renderList(); draw(); updateCount(); };
    r.append(im, inp, x); box.appendChild(r);
  });
}

$('files').onchange = async e => {
  for (const f of e.target.files){
    try {
      const b = await createImageBitmap(f);
      const c = document.createElement('canvas'); c.width = 360; c.height = 480;
      const x = c.getContext('2d'), sc = Math.max(360/b.width, 480/b.height);
      const w = b.width*sc, h = b.height*sc;
      x.drawImage(b, (360 - w)/2, (480 - h)*.3, w, h);
      people.push({name: f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' '), photo: c.toDataURL('image/jpeg', .8)});
    } catch (err) {}
  }
  e.target.value = ''; seen.clear(); renderList(); draw(); updateCount();
};

$('enter').onclick = () => { $('home').hidden = true; $('game').hidden = false; size(); updateCount(); };
$('back').onclick = () => { $('game').hidden = true; $('home').hidden = false; };
$('spin').onclick = spin;
$('again').onclick = () => { $('ov').hidden = true; spin(); };
$('close').onclick = () => { $('ov').hidden = true; };
$('ov').onclick = e => { if (e.target === $('ov')) $('ov').hidden = true; };
addEventListener('resize', () => { if (!$('game').hidden) size(); });
</script>
